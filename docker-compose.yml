# Secure by default: secrets are required (no fallback values) and the demo admin user and Swagger are off.
# For a local demo: copy .env.example to .env, which sets demo secrets and enables both switches.
services:
  postgres:
    image: postgres:16-alpine
    container_name: asisya-postgres
    environment:
      POSTGRES_DB: asisya_catalog
      POSTGRES_USER: asisya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD - see .env.example}
    ports:
      # Only reachable from this machine
      - "127.0.0.1:5432:5432"
    volumes:
      - asisya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asisya -d asisya_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asisya-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=asisya_catalog;Username=asisya;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD - see .env.example}
      Jwt__Issuer: Asisya.Catalog
      Jwt__Audience: Asisya.Catalog.Clients
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY (32+ chars) - see .env.example}
      Jwt__ExpirationMinutes: "120"
      Cors__AllowedOrigins__0: http://localhost:5173
      Seed__DefaultAdmin: ${SEED_DEFAULT_ADMIN:-false}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    ports:
      # Host 5192 -> container 8080 (8080 often reserved on Windows)
      - "5192:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser on host must call the published API port
        VITE_API_BASE_URL: http://localhost:5192
    container_name: asisya-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  asisya_pgdata:
